# Full stack: postgres + api + web + db-backup + caddy (reverse proxy on 127.0.0.1:${PROXY_PORT:-8090}).
# Point your existing cloudflared tunnel at http://localhost:8090.
# Required env vars: POSTGRES_PASSWORD, BETTER_AUTH_SECRET (see stack.env.example).
# For local development (just the DB on localhost:5434) use compose.dev.yml.
services:
  postgres:
    image: postgres:15
    container_name: officepong_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: officepong
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    command:
      - -dbhost=postgres
      - -dbport=5432
      - -dbname=officepong
      - -dbuser=postgres
      - -dbpass=${POSTGRES_PASSWORD}
      - -dbsslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_URL:-https://pingis.emiljo.com}
      NUXT_PUBLIC_API_BASED_URL: ${PUBLIC_URL:-https://pingis.emiljo.com}/api
      NUXT_PUBLIC_API_BASED_URL_WS: ${PUBLIC_WS_URL:-wss://pingis.emiljo.com}/api
      NUXT_DB_HOST: postgres
      NUXT_DB_PORT: '5432'
      NUXT_DB_NAME: officepong
      NUXT_DB_USER: postgres
      NUXT_DB_PASSWORD: ${POSTGRES_PASSWORD}
      NUXT_DB_SSL: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  proxy:
    build: ./deploy
    ports:
      - '127.0.0.1:${PROXY_PORT:-8090}:80'
    depends_on:
      - api
      - web
    restart: unless-stopped

  db-backup:
    image: prodrigestivill/postgres-backup-local:15
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: officepong
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ${BACKUP_DIR:-/tank/shared/nas-shared/backups/pingis}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
